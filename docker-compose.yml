services:
  backend:
    build:
      context: ./backend
    container_name: ecoanalysis-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - PYTHON_ANALYTICS_URL=http://analytics:8000
    depends_on:
      analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  analytics:
    build:
      context: ./services/analytics
    container_name: ecoanalysis-analytics
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: ecoanalysis-web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  portainer:
    image: portainer/portainer-ce:latest
    container_name: ecoanalysis-portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
