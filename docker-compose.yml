services:
  backend:
    build:
      context: ./backend
    container_name: ecoanalysis-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: ecoanalysis-web
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
